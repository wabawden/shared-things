services:
  postgres:
    image: postgres:18-alpine
    container_name: shared-things-postgres
    environment:
      POSTGRES_DB: shared_things
      POSTGRES_USER: shared_things
      POSTGRES_PASSWORD: development-only-password
    ports:
      - "5432:5432"
    volumes:
      - shared-things-postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U shared_things -d shared_things
      interval: 5s
      timeout: 5s
      retries: 10
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: shared-things-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: wabawden@aol.com
      PGADMIN_DEFAULT_PASSWORD: dev-password
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - postgres

volumes:
  shared-things-postgres-data:
  pgadmin-data: